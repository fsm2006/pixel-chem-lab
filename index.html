<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5">
<title>像素化学实验室</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2316133a'/%3E%3Crect x='6' y='2' width='4' height='2' fill='%23e2e8f0'/%3E%3Crect x='5' y='4' width='6' height='2' fill='%23e2e8f0'/%3E%3Crect x='4' y='6' width='8' height='2' fill='%2367e8f9'/%3E%3Crect x='5' y='8' width='6' height='5' fill='%2322c55e'/%3E%3Crect x='6' y='13' width='4' height='2' fill='%23e2e8f0'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/press-start-2p@5.0.0/400.css">
<style>
/* ============ 基础与像素变量 ============ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#16133a; --panel:#2a2557; --panel2:#3a3475;
  --ink:#e2e8f0; --line:#0a0820; --accent:#67e8f9; --gold:#fbbf24;
}
html,body{height:100%}
body{
  background:var(--bg);
  background-image:
    repeating-linear-gradient(0deg, rgba(255,255,255,.03) 0 2px, transparent 2px 16px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.03) 0 2px, transparent 2px 16px);
  color:var(--ink);
  font-family:"Press Start 2P","Courier New",ui-monospace,monospace;
  overflow:hidden;
}
button{font-family:inherit;cursor:pointer}
.app{
  height:100%;
  display:flex;flex-direction:column;padding:10px;gap:10px;
}
.side{display:none}
#bottomShelf{display:block}
/* ============ 硬边像素通用件 ============ */
.px-box{
  background:var(--panel);border:3px solid var(--line);
  box-shadow:4px 4px 0 var(--line);
}
.px-btn{
  background:var(--panel2);color:var(--ink);
  border:3px solid var(--line);box-shadow:3px 3px 0 var(--line);
  padding:8px 10px;font-size:10px;line-height:1.4;
}
.px-btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--line)}
.px-btn.gold{background:var(--gold);color:#1a1530}
/* ============ 顶栏 ============ */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.title{font-size:13px;line-height:1.5;color:var(--accent);text-shadow:2px 2px 0 var(--line)}
.progress{font-size:10px;background:var(--panel2);border:3px solid var(--line);padding:6px 8px;white-space:nowrap}
.progress b{color:var(--gold)}
.top-actions{display:flex;gap:6px}
.top-actions .px-btn{padding:8px 8px;font-size:9px}
/* ============ 工作台 ============ */
.stage{
  flex:1;min-height:0;position:relative;
  background:var(--panel);border:3px solid var(--line);box-shadow:4px 4px 0 var(--line);
  overflow:hidden;
  background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.025) 0 6px,transparent 6px 12px);
}
.stage-hint{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  text-align:center;font-size:10px;line-height:2;color:rgba(226,232,240,.45);padding:20px;
  pointer-events:none;
}
.token{
  position:absolute;width:72px;height:72px;
  display:flex;align-items:center;justify-content:center;
  border:3px solid var(--line);border-radius:50%;
  box-shadow:3px 3px 0 var(--line);
  font-size:13px;font-weight:bold;
  transition:transform .18s ease, left .25s ease, top .25s ease, opacity .25s ease;
}
.token.t1{left:50%;top:38%;transform:translate(-110%,-50%)}
.token.t2{left:50%;top:38%;transform:translate(10%,-50%)}
.token.merge{left:50%;top:45%;transform:translate(-50%,-50%) scale(1.15)}
.token.shake{animation:shake .42s linear}
@keyframes shake{
  0%,100%{margin-left:0}20%{margin-left:-9px}40%{margin-left:8px}
  60%{margin-left:-6px}80%{margin-left:5px}
}
.spark{position:absolute;width:6px;height:6px;background:var(--gold);pointer-events:none;animation:spark .5s ease-out forwards}
@keyframes spark{
  from{opacity:1;transform:scale(1)}
  to{opacity:0;transform:scale(2.6) translate(var(--dx),var(--dy))}
}
/* ============ 底部物质面板 ============ */
.panel-label{font-size:9px;color:var(--accent);margin-bottom:6px}
.shelf{
  background:var(--panel);border:3px solid var(--line);box-shadow:4px 4px 0 var(--line);
  padding:10px;
}
.shelf-grid{
  max-height:172px;overflow-y:auto;
}
.cat-group{margin-bottom:10px}
.cat-group:last-child{margin-bottom:2px}
.cat-label{font-size:9px;color:var(--gold);margin-bottom:5px}
.cat-row{display:flex;flex-wrap:wrap;gap:8px}
.orb{
  width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  border:3px solid var(--line);border-radius:50%;
  box-shadow:2px 2px 0 var(--line);
  font-size:10px;font-weight:bold;user-select:none;touch-action:none;
}
.orb.small{width:44px;height:44px}
.orb:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--line)}
.ghost{
  position:fixed;z-index:99;width:64px;height:64px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  border:3px solid var(--line);box-shadow:3px 3px 0 var(--line);
  font-size:11px;font-weight:bold;pointer-events:none;
  transform:translate(-50%,-50%) scale(1.08);
}
/* ============ 弹窗 ============ */
.overlay{
  position:fixed;inset:0;background:rgba(8,6,28,.78);
  display:none;align-items:center;justify-content:center;z-index:50;padding:18px;
}
.overlay.show{display:flex}
.modal{
  width:100%;max-width:340px;background:var(--panel);
  border:4px solid var(--line);box-shadow:6px 6px 0 var(--line);
  padding:18px;text-align:center;
  max-height:88vh;overflow-y:auto;
}
.modal-badge{font-size:10px;color:var(--gold);margin-bottom:14px}
.modal-orb{
  width:88px;height:88px;margin:0 auto 14px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  border:3px solid var(--line);box-shadow:3px 3px 0 var(--line);font-size:16px;font-weight:bold;
}
.modal-name{font-size:14px;margin-bottom:12px;color:var(--accent)}
.modal-eq{
  font-size:11px;line-height:1.8;background:var(--panel2);
  border:3px solid var(--line);padding:12px 8px;margin-bottom:16px;word-break:break-all;
}
/* 图鉴 */
.codex-grid{margin:14px 0 16px;text-align:left}
.codex-section{margin-bottom:12px}
.codex-cat{font-size:9px;color:var(--gold);margin-bottom:6px}
.codex-row{display:flex;flex-wrap:wrap;gap:8px}
.codex-slot{
  width:40px;height:40px;border:3px solid var(--line);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:bold;box-shadow:2px 2px 0 var(--line);
}
.codex-slot.unknown{background:#1c1845;color:rgba(226,232,240,.35)}
.codex-meta{font-size:9px;margin-bottom:4px}
/* ============ 宽屏：面板分到工作台两侧 ============ */
@media (min-width:768px){
  .app{
    display:grid;
    grid-template-columns:200px 1fr 200px;
    grid-template-rows:auto 1fr;
  }
  .top{grid-column:1/-1}
  .side{
    display:block;background:var(--panel);border:3px solid var(--line);
    box-shadow:4px 4px 0 var(--line);padding:10px;
    overflow-y:auto;align-self:stretch;
  }
  .side .shelf-grid{max-height:none;overflow:visible}
  .stage{grid-column:2;grid-row:2;min-height:0}
  #sideLeft{grid-column:1;grid-row:2}
  #sideRight{grid-column:3;grid-row:2}
  #bottomShelf{display:none}
  .orb{width:48px;height:48px;font-size:11px}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="title">像素化学实验室</div>
    <div class="progress"><b id="foundCount">0</b> / <span id="totalCount">0</span></div>
    <div class="top-actions">
      <button class="px-btn" id="codexBtn">图鉴</button>
      <button class="px-btn" id="resetBtn">重置</button>
    </div>
  </div>

  <aside class="side left" id="sideLeft">
    <div class="panel-label">已发现</div>
    <div class="shelf-grid" id="shelfLeft"></div>
  </aside>

  <div class="stage" id="stage">
    <div class="stage-hint" id="stageHint">把物质拖到这里<br>两个物质相遇即发生反应</div>
  </div>

  <aside class="side right" id="sideRight">
    <div class="panel-label">图鉴速览</div>
    <div id="codexMini"></div>
  </aside>

  <div class="shelf" id="bottomShelf">
    <div class="panel-label">已发现物质（可拖动 / 点按）</div>
    <div class="shelf-grid" id="shelfBottom"></div>
  </div>
</div>

<!-- ===== 弹窗：合成结果 ===== -->
<div class="overlay" id="resultOverlay">
  <div class="modal">
    <div class="modal-badge" id="resultBadge">新发现！</div>
    <div class="modal-orb" id="resultOrb"></div>
    <div class="modal-name" id="resultName"></div>
    <div class="modal-eq" id="resultEq"></div>
    <button class="px-btn gold" id="continueBtn">继续探索</button>
  </div>
</div>

<!-- ===== 弹窗：图鉴 ===== -->
<div class="overlay" id="codexOverlay">
  <div class="modal">
    <div class="modal-badge">物质图鉴</div>
    <div class="codex-meta" id="codexMeta"></div>
    <div class="codex-grid" id="codexGrid"></div>
    <button class="px-btn gold" id="codexCloseBtn">关闭</button>
  </div>
</div>

<script>
/* ================= 数据：20 种物质 ================= */
const CATEGORIES = ["单质","氧化物","酸","碱","盐","氢化物"];
const SUBSTANCES = [
  {id:"h2",   f:"H₂",   name:"氢气",     color:"#7dd3fc", text:"#10243d", start:true, cat:"单质"},
  {id:"o2",   f:"O₂",   name:"氧气",     color:"#ef4444", text:"#fff",    start:true, cat:"单质"},
  {id:"c",    f:"C",    name:"碳",       color:"#525252", text:"#fff",    start:true, cat:"单质"},
  {id:"n2",   f:"N₂",   name:"氮气",     color:"#166534", text:"#fff",    start:true, cat:"单质"},
  {id:"fe",   f:"Fe",   name:"铁",       color:"#94a3b8", text:"#182234", start:true, cat:"单质"},
  {id:"na",   f:"Na",   name:"钠",       color:"#f59e0b", text:"#3a2405", start:true, cat:"单质"},
  {id:"cl2",  f:"Cl₂",  name:"氯气",     color:"#22c55e", text:"#062812", start:true, cat:"单质"},
  {id:"s",    f:"S",    name:"硫",       color:"#eab308", text:"#3a2d03", start:true, cat:"单质"},
  {id:"h2o",  f:"H₂O",  name:"水",       color:"#0ea5e9", text:"#fff",    cat:"氧化物"},
  {id:"co2",  f:"CO₂",  name:"二氧化碳", color:"#6b7280", text:"#fff",    cat:"氧化物"},
  {id:"fe2o3",f:"Fe₂O₃",name:"氧化铁",   color:"#b45309", text:"#fff",    cat:"氧化物"},
  {id:"so2",  f:"SO₂",  name:"二氧化硫", color:"#a3e635", text:"#1a2e05", cat:"氧化物"},
  {id:"hcl",  f:"HCl",  name:"氯化氢",   color:"#86efac", text:"#0a3d22", cat:"酸"},
  {id:"h2co3",f:"H₂CO₃",name:"碳酸",     color:"#2dd4bf", text:"#06302b", cat:"酸"},
  {id:"naoh", f:"NaOH", name:"氢氧化钠", color:"#c084fc", text:"#2a0f4a", cat:"碱"},
  {id:"nacl", f:"NaCl", name:"氯化钠",   color:"#f8fafc", text:"#1f2937", cat:"盐"},
  {id:"fecl3",f:"FeCl₃",name:"氯化铁",   color:"#ea580c", text:"#fff",    cat:"盐"},
  {id:"na2co3",f:"Na₂CO₃",name:"碳酸钠", color:"#e2e8f0", text:"#1f2937", cat:"盐"},
  {id:"nh4cl",f:"NH₄Cl",name:"氯化铵",   color:"#a5b4fc", text:"#1e2a5e", cat:"盐"},
  {id:"nh3",  f:"NH₃",  name:"氨气",     color:"#67e8f9", text:"#083344", cat:"氢化物"},
  {id:"nh4oh",f:"NH₃·H₂O",name:"一水合氨",color:"#99f6e4",text:"#0f3d3a", cat:"碱"}
];
const BY_ID = Object.fromEntries(SUBSTANCES.map(s=>[s.id,s]));

/* ================= 数据：反应配方 ================= */
const RECIPES = [
  {a:"h2", b:"o2",  r:"h2o",  eq:"2H₂ + O₂ → 2H₂O"},
  {a:"c",  b:"o2",  r:"co2",  eq:"C + O₂ → CO₂"},
  {a:"na", b:"cl2", r:"nacl", eq:"2Na + Cl₂ → 2NaCl"},
  {a:"h2", b:"cl2", r:"hcl",  eq:"H₂ + Cl₂ → 2HCl"},
  {a:"fe", b:"o2",  r:"fe2o3",eq:"4Fe + 3O₂ → 2Fe₂O₃"},
  {a:"s",  b:"o2",  r:"so2",  eq:"S + O₂ → SO₂"},
  {a:"h2o",b:"co2", r:"h2co3",eq:"H₂O + CO₂ → H₂CO₃"},
  {a:"na", b:"h2o", r:"naoh", eq:"2Na + 2H₂O → 2NaOH + H₂"},
  {a:"fe", b:"cl2", r:"fecl3",eq:"2Fe + 3Cl₂ → 2FeCl₃"},
  {a:"naoh",b:"co2",r:"na2co3",eq:"2NaOH + CO₂ → Na₂CO₃ + H₂O"},
  {a:"n2", b:"h2",  r:"nh3",  eq:"N₂ + 3H₂ → 2NH₃"},
  {a:"nh3",b:"hcl", r:"nh4cl",eq:"NH₃ + HCl → NH₄Cl"},
  {a:"nh3",b:"h2o", r:"nh4oh",eq:"NH₃ + H₂O ⇌ NH₃·H₂O"},
  {a:"naoh",b:"hcl",r:"nacl", eq:"NaOH + HCl → NaCl + H₂O"},
  {a:"naoh",b:"h2co3",r:"na2co3",eq:"2NaOH + H₂CO₃ → Na₂CO₃ + 2H₂O"},
  {a:"hcl",b:"na2co3",r:"nacl",eq:"2HCl + Na₂CO₃ → 2NaCl + H₂O + CO₂"},
  {a:"fe2o3",b:"hcl",r:"fecl3",eq:"Fe₂O₃ + 6HCl → 2FeCl₃ + 3H₂O"}
];
function findRecipe(x,y){
  return RECIPES.find(r=>(r.a===x&&r.b===y)||(r.a===y&&r.b===x))||null;
}

/* ================= 状态 ================= */
const SAVE_KEY = "pixel_chem_lab_save_v1";
let discovered = new Set(SUBSTANCES.filter(s=>s.start).map(s=>s.id));
let workspace = []; // 最多 2 个 {id, el}
let busy = false;

function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify([...discovered]))}catch(e){}}
function load(){
  try{
    const d = JSON.parse(localStorage.getItem(SAVE_KEY));
    if(Array.isArray(d)&&d.length){discovered = new Set(d.filter(id=>BY_ID[id]));}
  }catch(e){}
}
/* ================= 渲染：面板与进度 ================= */
function makeOrb(s,small){
  const orb=document.createElement("div");
  orb.className=small?"orb small":"orb";
  orb.style.background=s.color; orb.style.color=s.text;
  orb.textContent=s.f;
  orb.addEventListener("pointerdown",e=>startDrag(e,s.id));
  return orb;
}
function buildCatGroup(cat,list){
  const group=document.createElement("div");
  group.className="cat-group";
  const label=document.createElement("div");
  label.className="cat-label";
  label.textContent=cat;
  group.appendChild(label);
  const row=document.createElement("div");
  row.className="cat-row";
  list.forEach(s=>row.appendChild(makeOrb(s,true)));
  group.appendChild(row);
  return group;
}
function renderShelf(){
  const leftEl=document.getElementById("shelfLeft");
  const bottomEl=document.getElementById("shelfBottom");
  leftEl.innerHTML=""; bottomEl.innerHTML="";
  CATEGORIES.forEach(cat=>{
    const list=SUBSTANCES.filter(s=>s.cat===cat&&discovered.has(s.id));
    if(!list.length)return;
    leftEl.appendChild(buildCatGroup(cat,list));   // 左栏：全部已发现
    bottomEl.appendChild(buildCatGroup(cat,list)); // 窄屏底部：全量
  });
}
/* 右栏常驻图鉴速览：全部物质，未发现显示 ? */
function renderCodexMini(){
  const box=document.getElementById("codexMini");
  box.innerHTML="";
  CATEGORIES.forEach(cat=>{
    const list=SUBSTANCES.filter(s=>s.cat===cat);
    if(!list.length)return;
    const found=list.filter(s=>discovered.has(s.id)).length;
    const sec=document.createElement("div");
    sec.className="codex-section";
    const head=document.createElement("div");
    head.className="codex-cat";
    head.textContent=cat+" "+found+"/"+list.length;
    sec.appendChild(head);
    const row=document.createElement("div");
    row.className="codex-row";
    list.forEach(s=>{
      const slot=document.createElement("div");
      if(discovered.has(s.id)){
        slot.className="codex-slot";
        slot.style.background=s.color; slot.style.color=s.text; slot.textContent=s.f;
      }else{
        slot.className="codex-slot unknown"; slot.textContent="?";
      }
      row.appendChild(slot);
    });
    sec.appendChild(row);
    box.appendChild(sec);
  });
}
function renderProgress(){
  document.getElementById("foundCount").textContent=discovered.size;
  document.getElementById("totalCount").textContent=SUBSTANCES.length;
}
function renderAll(){renderShelf();renderCodexMini();renderProgress();}

/* ================= 工作台 token ================= */
function addToken(id){
  const stage=document.getElementById("stage");
  const sub=BY_ID[id];
  const el=document.createElement("div");
  el.className="token "+(workspace.length?"t2":"t1");
  el.style.background=sub.color; el.style.color=sub.text;
  el.textContent=sub.f; el.dataset.id=id;
  stage.appendChild(el);
  workspace.push({id,el});
  document.getElementById("stageHint").style.display="none";
}
function clearWorkspace(){
  workspace.forEach(t=>t.el.remove());
  workspace=[];
  document.getElementById("stageHint").style.display="";
}
function burst(el){
  const r=el.getBoundingClientRect();
  const cx=r.left+r.width/2, cy=r.top+r.height/2;
  for(let i=0;i<10;i++){
    const sp=document.createElement("div");
    sp.className="spark";
    const ang=(Math.PI*2/10)*i, dist=40+Math.random()*26;
    sp.style.setProperty("--dx",Math.cos(ang)*dist+"px");
    sp.style.setProperty("--dy",Math.sin(ang)*dist+"px");
    sp.style.left=cx+"px"; sp.style.top=cy+"px";
    document.body.appendChild(sp);
    setTimeout(()=>sp.remove(),520);
  }
}

/* ================= 反应判定 ================= */
function evaluate(){
  const a=workspace[0], b=workspace[1];
  const recipe=findRecipe(a.id,b.id);
  busy=true;
  if(recipe){
    setTimeout(()=>{
      a.el.classList.add("merge"); b.el.classList.add("merge");
      burst(a.el);
      setTimeout(()=>{
        clearWorkspace(); busy=false;
        const isNew=!discovered.has(recipe.r);
        if(isNew){discovered.add(recipe.r);save();renderAll();}
        showResult(recipe.r,recipe.eq,isNew);
      },430);
    },180);
  }else{
    a.el.classList.add("shake"); b.el.classList.add("shake");
    setTimeout(()=>{clearWorkspace();busy=false;},560);
  }
}
function placeFromShelf(id,ontoId){
  if(busy)return;
  if(ontoId){
    if(workspace.length!==1||workspace[0].id!==ontoId)return;
    addToken(id); evaluate();
  }else{
    if(workspace.length>=2)return;
    addToken(id);
    if(workspace.length===2) setTimeout(evaluate,120);
  }
}

/* ================= 拖拽（pointer 事件，触摸+鼠标通用） ================= */
function startDrag(e,id){
  e.preventDefault();
  const sx=e.clientX, sy=e.clientY;
  const sub=BY_ID[id];
  const ghost=document.createElement("div");
  ghost.className="ghost";
  ghost.style.background=sub.color; ghost.style.color=sub.text;
  ghost.textContent=sub.f;
  ghost.style.left=sx+"px"; ghost.style.top=sy+"px";
  document.body.appendChild(ghost);
  let moved=false;
  function move(ev){
    if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>8)moved=true;
    ghost.style.left=ev.clientX+"px"; ghost.style.top=ev.clientY+"px";
  }
  function up(ev){
    window.removeEventListener("pointermove",move);
    window.removeEventListener("pointerup",up);
    window.removeEventListener("pointercancel",up);
    ghost.remove();
    if(!moved){placeFromShelf(id);return;} // 点按等价操作
    const target=document.elementFromPoint(ev.clientX,ev.clientY);
    const tokenEl=target&&target.closest(".token");
    const stageRect=document.getElementById("stage").getBoundingClientRect();
    const inStage=ev.clientX>=stageRect.left&&ev.clientX<=stageRect.right
      &&ev.clientY>=stageRect.top&&ev.clientY<=stageRect.bottom;
    if(tokenEl){
      const hit=workspace.find(t=>t.el===tokenEl);
      if(hit)placeFromShelf(id,hit.id);
    }else if(inStage){
      placeFromShelf(id);
    }
  }
  window.addEventListener("pointermove",move);
  window.addEventListener("pointerup",up);
  window.addEventListener("pointercancel",up);
}

/* ================= 弹窗 ================= */
function showResult(id,eq,isNew){
  const sub=BY_ID[id];
  document.getElementById("resultBadge").textContent=isNew?"新发现！":"已收录";
  const orb=document.getElementById("resultOrb");
  orb.style.background=sub.color; orb.style.color=sub.text; orb.textContent=sub.f;
  document.getElementById("resultName").textContent=sub.f+" · "+sub.name;
  document.getElementById("resultEq").textContent=eq;
  document.getElementById("resultOverlay").classList.add("show");
}
function openCodex(){
  const grid=document.getElementById("codexGrid");
  grid.innerHTML="";
  CATEGORIES.forEach(cat=>{
    const list=SUBSTANCES.filter(s=>s.cat===cat);
    if(!list.length)return;
    const found=list.filter(s=>discovered.has(s.id)).length;
    const sec=document.createElement("div");
    sec.className="codex-section";
    const head=document.createElement("div");
    head.className="codex-cat";
    head.textContent=cat+"  "+found+"/"+list.length;
    sec.appendChild(head);
    const row=document.createElement("div");
    row.className="codex-row";
    list.forEach(s=>{
      const slot=document.createElement("div");
      if(discovered.has(s.id)){
        slot.className="codex-slot";
        slot.style.background=s.color; slot.style.color=s.text; slot.textContent=s.f;
      }else{
        slot.className="codex-slot unknown"; slot.textContent="?";
      }
      row.appendChild(slot);
    });
    sec.appendChild(row);
    grid.appendChild(sec);
  });
  document.getElementById("codexMeta").textContent="已发现 "+discovered.size+" / "+SUBSTANCES.length;
  document.getElementById("codexOverlay").classList.add("show");
}

/* ================= 按钮与初始化 ================= */
document.getElementById("continueBtn").addEventListener("click",()=>{
  document.getElementById("resultOverlay").classList.remove("show");
});
document.getElementById("codexBtn").addEventListener("click",openCodex);
document.getElementById("codexCloseBtn").addEventListener("click",()=>{
  document.getElementById("codexOverlay").classList.remove("show");
});
document.getElementById("resetBtn").addEventListener("click",()=>{
  if(confirm("确定清空所有进度，重新开始吗？")){
    discovered=new Set(SUBSTANCES.filter(s=>s.start).map(s=>s.id));
    clearWorkspace(); save(); renderAll();
  }
});
load();
renderAll();
</script>
